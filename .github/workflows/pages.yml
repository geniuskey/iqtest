# main 브랜치에 푸시하면 테스트 후 정적 사이트를 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions"로 설정해야 동작한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 사이트에 필요한 파일만 골라서 배포 (서버 코드·테스트·README는 올리지 않는다)
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html app.js style.css config.js favicon.svg core CNAME _site/
          if [ -f ads.txt ]; then cp ads.txt _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
